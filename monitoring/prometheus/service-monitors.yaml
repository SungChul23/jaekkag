# ============================================================
# Order API ServiceMonitor
# ============================================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-api
  namespace: monitoring
  labels:
    # kube-prometheus-stack이 이 ServiceMonitor를 선택하기 위한 Label
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - ecommerce

  selector:
    matchLabels:
      app: order-api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

---
