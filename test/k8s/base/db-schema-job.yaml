# 이 파일은 --- 로 구분된 두 개의 리소스를 포함함
# 1) db-schema ConfigMap : DB 초기화용 SQL 스크립트를 파일 형태로 저장
# 2) db-schema-init Job  : 클러스터가 뜬 뒤 위 SQL을 실제 DB에 1회 실행하는 초기화 작업
#
# schema.sql 안에서 만드는 테이블 요약 (SQL 내용 자체는 실행에 영향이 갈 수 있어 수정하지 않고,
# 아래 설명만 참고용으로 추가함)
#   - orders            : 주문 정보 저장 (order-api가 씀)
#   - outbox_events      : 아웃박스 패턴용 이벤트 로그.
#                          order-api가 주문 생성 시 같이 기록하고,
#                          outbox-publisher가 이 테이블을 읽어 Kinesis로 발행함
#   - master_inventory   : 상품별 재고 마스터 (inventory-worker가 재고 차감)
#   - processed_events   : 이미 처리한 이벤트 ID 기록 (inventory-worker의 중복 처리 방지용)
#   - 마지막 INSERT IGNORE 문은 상품 10/20/30에 대한 초기 재고 데이터를 넣어줌
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-schema
  namespace: ecommerce
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS orders (
        order_id     BIGINT AUTO_INCREMENT PRIMARY KEY,
        product_id   INT NOT NULL,
        quantity     INT NOT NULL,
        created_at   TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS outbox_events (
        event_id     CHAR(36) PRIMARY KEY,
        order_id     BIGINT NOT NULL,
        product_id   INT NOT NULL,
        quantity     INT NOT NULL,
        status       VARCHAR(20) NOT NULL DEFAULT 'PENDING',
        created_at   TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        published_at TIMESTAMP NULL,
        INDEX idx_status_created (status, created_at)
    );
    CREATE TABLE IF NOT EXISTS master_inventory (
        product_id   INT PRIMARY KEY,
        stock        INT NOT NULL
    );
    CREATE TABLE IF NOT EXISTS processed_events (
        event_id     CHAR(36) PRIMARY KEY,
        result       VARCHAR(20) NOT NULL,
        processed_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    INSERT IGNORE INTO master_inventory (product_id, stock) VALUES (10, 1000), (20, 500), (30, 200);
---
apiVersion: batch/v1
kind: Job                      # Job: 완료되면 종료되는 1회성 작업 (Deployment처럼 계속 떠있지 않음)
metadata:
  name: db-schema-init
  namespace: ecommerce
spec:
  backoffLimit: 2               # 실패 시 최대 재시도 횟수
  template:
    spec:
      restartPolicy: Never      # Job의 Pod는 restartPolicy로 Always를 쓸 수 없고 Never/OnFailure만 가능
      containers:
        - name: mysql-client
          image: mysql:8.0       # mysql CLI가 포함된 공식 이미지를 사용해 SQL 실행
          envFrom:                # 위에서 만든 ConfigMap/Secret 값을 통째로 환경변수로 주입
            - configMapRef:
                name: ecommerce-config   # DB_HOST, DB_PORT, DB_NAME 등
            - secretRef:
                name: ecommerce-secret   # DB_USER, DB_PASSWORD
          command:                # 컨테이너 실행 시 환경변수를 이용해 mysql 접속 후 schema.sql 실행
            - sh
            - -c
            - "mysql -h $DB_HOST -P $DB_PORT -u $DB_USER -p$DB_PASSWORD $DB_NAME < /schema/schema.sql"
          volumeMounts:            # 아래 volumes에서 정의한 내용을 컨테이너 파일 경로에 마운트
            - name: schema
              mountPath: /schema   # db-schema ConfigMap이 /schema/schema.sql 파일로 마운트됨
      volumes:
        - name: schema
          configMap:
            name: db-schema        # 위에서 정의한 db-schema ConfigMap을 볼륨으로 사용
