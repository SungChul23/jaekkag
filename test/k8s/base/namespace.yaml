# Namespace: 하나의 클러스터 안에서 리소스들을 논리적으로 나누는 "가상 구역"
# 이 프로젝트의 다른 모든 리소스(ConfigMap, Secret, Deployment 등)는
# namespace: ecommerce 로 지정되어 이 구역 안에 함께 배치됨
apiVersion: v1        # Namespace는 쿠버네티스 기본(core) API 그룹인 v1 사용
kind: Namespace       # 생성할 리소스 종류 = 네임스페이스
metadata:
  name: ecommerce      # 네임스페이스 이름. 다른 리소스에서 namespace: ecommerce 로 참조함
  labels:               # 리소스를 검색/분류하기 위한 태그(꼬리표), 기능에는 영향 없음
    project: ecommerce
    environment: dev    # 개발 환경임을 표시 (운영 환경이면 보통 prod 등으로 별도 구성)
