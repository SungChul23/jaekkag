apiVersion: v1
kind: ServiceAccount
metadata:
  name: outbox-publisher
  namespace: ecommerce
  labels:
    app: outbox-publisher
    project: ecommerce
    environment: dev
  # Pod Identity 방식 사용.
  # IRSA(OIDC 기반)와 달리 role-arn annotation이 필요 없음.
  # terraform/irsa의 aws_eks_pod_identity_association 리소스가
  # 이 ServiceAccount 이름(outbox-publisher)을 기준으로
  # 자동으로 IAM Role(publisher_role)을 매칭해준다.