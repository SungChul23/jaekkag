apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  namespace: ecommerce
  labels:
    app: outbox-publisher
    project: ecommerce
    environment: dev
spec:
  # 3개로 병렬 처리.
  # Publisher 코드가 SELECT ... FOR UPDATE SKIP LOCKED 방식으로
  # 여러 파드가 동시에 폴링해도 서로 다른 이벤트를 나눠 갖도록
  # 구현되어 있어 중복 발행 없이 안전하게 병렬 처리 가능.
  replicas: 3

  selector:
    matchLabels:
      app: outbox-publisher

  template:
    metadata:
      labels:
        app: outbox-publisher
        project: ecommerce
        environment: dev
    spec:
      # serviceaccount.yaml에서 정의한 ServiceAccount를 사용
      # -> Pod Identity를 통해 Kinesis 발행 권한(IAM Role)이 자동 부여됨
      serviceAccountName: outbox-publisher

      containers:
        - name: outbox-publisher

          # TODO(배포 전 필수 교체): 실제 ECR 이미지 주소 + Git SHA 태그
          # 예: 123456789012.dkr.ecr.us-east-1.amazonaws.com/outbox-publisher:a1b2c3d
          image: "827913617635.dkr.ecr.us-east-1.amazonaws.com/outbox-publisher:v1"

          # ECR가 IMMUTABLE 태그 정책이라 항상 새 태그로 푸시되는데,
          # 혹시 모를 노드 이미지 캐싱 문제를 막기 위해 매번 최신 이미지를 pull
          imagePullPolicy: Always

          ports:
            - containerPort: 8001  # Prometheus 메트릭 노출 포트 (METRICS_PORT)

          # ecommerce-config(ConfigMap): DB_HOST, KINESIS_STREAM_NAME 등 일반 설정
          # ecommerce-db-secret(Secret): DB_USER, DB_PASSWORD 등 민감정보
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-db-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          # Publisher는 별도 HTTP API가 없으므로,
          # Prometheus 메트릭 포트(8001)가 응답하는지로 헬스체크 대체 (TCP 체크)
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
            
          env:
            # Publisher 전용 Prometheus 메트릭 포트
            - name: METRICS_PORT
              value: "8001"