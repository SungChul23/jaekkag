# ============================================================
# Outbox Publisher ServiceAccount
# ============================================================

# Outbox Publisher Pod가 EKS Pod Identity를 통해
# Kinesis 발행용 IAM Role을 사용할 때 필요한 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: outbox-publisher
  namespace: ecommerce
  labels:
    app: outbox-publisher
    project: ecommerce
    environment: dev

---
# ============================================================
# Inventory Worker ServiceAccount
# ============================================================

# Inventory Worker Pod가 EKS Pod Identity를 통해
# Kinesis 소비용 IAM Role을 사용할 때 필요한 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-worker
  namespace: ecommerce
  labels:
    app: inventory-worker
    project: ecommerce
    environment: dev