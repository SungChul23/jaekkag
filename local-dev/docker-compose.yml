version: "3.8"

# RDS(4번 인프라)가 아직 준비 안 됐을 때, 로컬에서 outbox-publisher를 끝까지 검증하기 위한 구성.
# 나중에 RDS가 준비되면 DB_HOST만 그쪽으로 바꾸면 그대로 동작함 (스키마 동일).
services:
  mysql:
    image: mysql:8.0
    container_name: role2-local-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: appuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3307:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
